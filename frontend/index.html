<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBot</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .empty-warning {
      display: none;
      color: #c0392b;
      font-size: 13px;
      margin-top: 6px;
      padding: 6px 10px;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      border-radius: 6px;
      animation: fadeIn 0.2s ease;
    }
    .empty-warning.visible {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Setup Panel -->
  <div id="setup-panel">
    <div class="setup-card">
      <h2>Configure API</h2>
      <p>Enter your OpenRouter API key and choose a model to get started. Your key is stored only in memory.</p>

      <label>OpenRouter API Key</label>
      <input type="password" id="api-key-input" placeholder="sk-or-v1-..." autocomplete="off" />

      <label>Model</label>
      <select id="model-select">
        <option value="openai/gpt-4o-mini">GPT-4o Mini (fast, cheap)</option>
        <option value="openai/gpt-4o">GPT-4o</option>
        <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
        <option value="anthropic/claude-3.7-sonnet">Claude 3.7 Sonnet</option>
        <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
      </select>

      <button class="btn" id="start-btn">Start Chatting</button>
      <p class="hint">Get your free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a><br>Your key never leaves your browser.</p>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-overlay">
    <div class="confirm-card">
      <p id="confirm-message">Are you sure?</p>
      <div class="confirm-btns">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo">ChatBot</div>
    <div class="model-badge" id="model-label">—</div>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div id="empty-state">
      <div class="big">_</div>
      <p>Start a conversation</p>
    </div>
  </div>

  <!-- Input -->
  <footer>
    <div class="input-row">
      <textarea id="input-box" placeholder="Type a message..." rows="1"></textarea>
      <button id="clear-btn" title="Clear chat">Clear</button>
      <button id="send-btn">Send</button>
    </div>
    <div id="empty-warning" class="empty-warning">Please type a message before sending.</div>
    <div class="error-msg" id="error-msg"></div>
  </footer>

  <script src="script.js"></script>
  <script>
    (function () {
      const sendBtn = document.getElementById('send-btn');
      const inputBox = document.getElementById('input-box');
      const warning = document.getElementById('empty-warning');

      function showWarning() {
        warning.classList.remove('visible');
        void warning.offsetWidth; // reflow to restart animation
        warning.classList.add('visible');
      }

      function hideWarning() {
        warning.classList.remove('visible');
      }

      function tryIntercept(e) {
        if (inputBox.value.trim() === '') {
          e.preventDefault();
          e.stopImmediatePropagation();
          showWarning();
          inputBox.focus();
        } else {
          hideWarning();
        }
      }

      sendBtn.addEventListener('click', tryIntercept, true);

      inputBox.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          if (inputBox.value.trim() === '') {
            e.preventDefault();
            e.stopImmediatePropagation();
            showWarning();
          } else {
            hideWarning();
          }
        }
      }, true);
    })();
  </script>
</body>
</html>
